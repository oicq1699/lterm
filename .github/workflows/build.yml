name: build-portable

# 推送 v* 标签（如 v0.1.0）或手动触发时，自动构建 Windows x64 / Linux x64 便携版
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 并上传产物所需

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台失败不牵连另一个
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      # 必须走 tauri CLI：裸 cargo build 不会设置生产标记，产物会按 dev 模式去连 localhost:1420 而白屏
      - name: Build portable binary (tauri CLI, no bundler)
        run: npx tauri build --no-bundle

      - name: Package portable
        shell: bash
        run: |
          mkdir -p out pkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/lterm.exe out/lterm.exe
          else
            cp src-tauri/target/release/lterm pkg/lterm
            cp src-tauri/icons/icon.png pkg/icon.png
            cp scripts/linux/install-icon.sh pkg/install-icon.sh
            tar -czf out/lterm-linux-x64-portable.tar.gz -C pkg lterm icon.png install-icon.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lterm-${{ matrix.os }}
          path: out/

      # 打标签触发的构建，把便携版挂到该 tag 的 Release 上
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/lterm.exe
            out/lterm-linux-x64-portable.tar.gz
          fail_on_missing: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
