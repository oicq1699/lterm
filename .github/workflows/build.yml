name: build-release

# 推送 v* 标签（如 v0.5.11）或手动触发时，构建 Windows NSIS 安装器与 Linux AppImage；
# 打标签时再由单独的 release 任务统一生成 latest.json 并上传一次，避免矩阵任务重复发版。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 并上传产物所需

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台失败不牵连另一个
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev libfuse2 patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      # 必须走 tauri CLI：裸 cargo build 不会设置生产标记，产物会按 dev 模式去连 localhost:1420 而白屏
      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # 打包器每构建一种安装包都会还原未打补丁的主程序，因此这里的 lterm.exe 是便携版，
      # install_kind() 会返回 portable；unix 侧只收 AppImage 及其签名。
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/lterm.exe out/lterm.exe
            cp src-tauri/target/release/bundle/nsis/*.exe out/
            cp src-tauri/target/release/bundle/nsis/*.exe.sig out/
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage out/
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig out/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lterm-${{ matrix.os }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: lterm-*
          merge-multiple: true

      - name: Generate latest.json
        run: node scripts/make-latest-json.mjs "${GITHUB_REF_NAME#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
